name: Publish Module

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Folder name under packages/module to publish (e.g. "my-extension" for packages/module/my-extension)'
        type: string
        required: true
      dryRun:
        description: 'Dry run (npm publish --dry-run, no live publish)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODULE_PATH: packages/module/${{ inputs.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify module folder exists
        run: |
          test -d "$MODULE_PATH" || { echo "No such folder: $MODULE_PATH"; exit 1; }

      - name: Build module
        run: npx turbo run build --filter="./$MODULE_PATH"

      - name: Validate marketplace package requirements
        run: node scripts/validate-module-package.mjs "$MODULE_PATH"

      - name: Configure npm auth
        run: |
          AUTH=$(printf '%s:%s' "$NPM_USERNAME" "$NPM_PASSWORD" | base64)
          {
            echo "//${NPM_REGISTRY_HOST}/:_auth=${AUTH}"
            echo "//${NPM_REGISTRY_HOST}/:always-auth=true"
          } >> "$MODULE_PATH/.npmrc"
        env:
          NPM_REGISTRY_HOST: ${{ vars.NPM_REGISTRY_HOST }}
          NPM_USERNAME: ${{ secrets.NPM_USERNAME }}
          NPM_PASSWORD: ${{ secrets.NPM_PASSWORD }}

      - name: Publish
        working-directory: ${{ env.MODULE_PATH }}
        run: npm publish --registry "https://${NPM_REGISTRY_HOST}" ${{ inputs.dryRun && '--dry-run' || '' }}
        env:
          NPM_REGISTRY_HOST: ${{ vars.NPM_REGISTRY_HOST }}

      - name: Clean up npm auth
        if: always()
        run: rm -f "$MODULE_PATH/.npmrc"
